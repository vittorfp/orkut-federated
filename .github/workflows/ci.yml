name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://orkut:orkut@localhost:5432/orkut_federated

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orkut_federated
          POSTGRES_PASSWORD: orkut
          POSTGRES_USER: orkut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orkut -d orkut_federated"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://orkut:orkut@localhost:5432/orkut_federated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm db:verify
